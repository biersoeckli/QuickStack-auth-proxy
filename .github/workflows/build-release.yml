name: Production - Build and Push Auth Proxy Image

on:
  workflow_dispatch:
  release:
    types: [released, prereleased]

permissions:
  contents: read

concurrency:
  group: auth-proxy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  build-and-push-amd64:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.amd64
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION_ARG=${{ github.ref_name }}
          tags: |
            quickstack/auth-proxy:latest-amd64
            quickstack/auth-proxy:${{ github.ref_name }}-amd64

  build-and-push-arm64:
    runs-on: ubuntu-24.04-arm
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.arm64
          push: true
          platforms: linux/arm64
          build-args: |
            VERSION_ARG=${{ github.ref_name }}
          tags: |
            quickstack/auth-proxy:latest-arm64
            quickstack/auth-proxy:${{ github.ref_name }}-arm64

  publish-manifests:
    runs-on: ubuntu-latest
    needs: [build-and-push-amd64, build-and-push-arm64]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-architecture manifests
        run: |
          docker buildx imagetools create -t quickstack/auth-proxy:latest \
            quickstack/auth-proxy:latest-amd64 \
            quickstack/auth-proxy:latest-arm64
          docker buildx imagetools inspect quickstack/auth-proxy:latest
          docker buildx imagetools create -t quickstack/auth-proxy:${{ github.ref_name }} \
            quickstack/auth-proxy:${{ github.ref_name }}-amd64 \
            quickstack/auth-proxy:${{ github.ref_name }}-arm64
          docker buildx imagetools inspect quickstack/auth-proxy:${{ github.ref_name }}
